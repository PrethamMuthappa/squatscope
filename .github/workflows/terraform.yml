name: terraform

on:
  pull_request:
    paths:
      - "app/**"
      - "envs/**"
      - "modules/**"
      - "site/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "envs/**"
      - "modules/**"
      - "site/**"
      - ".github/workflows/terraform.yml"

permissions:
  id-token: write       # lets the job request an OIDC token from GitHub
  contents: read
  pull-requests: write  # lets the job comment the plan on the PR

# Never run two plans/applies against dev at the same time
concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPO: squatscope-scorer

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/dev

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Unit tests
        working-directory: app/scorer
        run: python -m unittest -v

      # Image tag = git hash of the scorer folder: same code, same tag
      - name: Image tag
        run: echo "IMAGE_TAG=$(git rev-parse HEAD:app/scorer)" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.7
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Format check
        run: terraform fmt -check -recursive ../..

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        run: |
          terraform plan -input=false -no-color -var "scorer_image_tag=$IMAGE_TAG" -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Comment plan on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Terraform plan: dev"
            echo "Scorer image tag: \`$IMAGE_TAG\`"
            echo '```'
            cat plan.txt
            echo '```'
          } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/dev

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Unit tests
        working-directory: app/scorer
        run: python -m unittest -v

      - name: Image tag
        run: echo "IMAGE_TAG=$(git rev-parse HEAD:app/scorer)" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.7
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tags are immutable, so only build when this code version isn't in ECR yet
      - name: Build and push image
        working-directory: app/scorer
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPO" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "Image $IMAGE_TAG already in ECR, skipping build"
          else
            # Lambda needs a plain image manifest, not a provenance attestation index
            docker build --provenance=false -t "$REGISTRY/$ECR_REPO:$IMAGE_TAG" .
            docker push "$REGISTRY/$ECR_REPO:$IMAGE_TAG"
          fi

      - name: Init
        run: terraform init -input=false

      - name: Apply
        run: terraform apply -input=false -auto-approve -var "scorer_image_tag=$IMAGE_TAG"

      - name: Upload site
        run: aws s3 sync ../../site "s3://$(terraform output -raw site_bucket)" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$(terraform output -raw distribution_id)" \
            --paths "/*"
